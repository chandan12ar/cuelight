<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuelight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2310151c%27/%3E%3Crect x=%277%27 y=%277%27 width=%2711%27 height=%274%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2712%27 y=%2714%27 width=%2713%27 height=%274%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2716%27 y=%2721%27 width=%279%27 height=%274%27 rx=%272%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
/* Applied before first paint, so a dark-mode user never sees a white flash. */
try { var t = localStorage.getItem("orchestra-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="7" class="brand-tile"/>
        <rect x="6" y="6.5" width="10" height="3.6" rx="1.8" class="brand-bar"/>
        <rect x="10.5" y="12.2" width="12" height="3.6" rx="1.8" class="brand-bar"/>
        <rect x="14" y="17.9" width="8" height="3.6" rx="1.8" class="brand-bar"/>
      </svg>
      <h1>Cuelight</h1>
    </div>
    <select id="session-picker" aria-label="Session"></select>
    <span id="conn" class="conn"></span>
    <span class="bar-spacer"></span>
    <button id="palette-open" type="button" class="palette-trigger" aria-label="Search agents, tool calls and commands (Ctrl K)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 13.2 L17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="palette-trigger-text">Search or jump to</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="toolbar" role="toolbar" aria-label="Dashboard controls">
      <button id="live-toggle" type="button" aria-pressed="true">Live</button>
      <button id="notify-toggle" type="button" aria-pressed="false">Notify</button>
      <button id="sound-toggle" type="button" aria-pressed="false" hidden>Sound</button>
      <details id="sound-prefs" class="sound-prefs" hidden>
        <summary aria-label="Sound options">Options</summary>
        <div class="sound-prefs-body">
          <label><input type="checkbox" id="sound-play-alert"> Claude needs you</label>
          <label><input type="checkbox" id="sound-play-fail"> Something failed</label>
          <label><input type="checkbox" id="sound-play-done"> Run finished</label>
          <label><input type="checkbox" id="sound-quiet-on"> Quiet hours</label>
          <span class="sound-quiet-range">
            <input type="time" id="sound-quiet-from" aria-label="Quiet from">
            to
            <input type="time" id="sound-quiet-to" aria-label="Quiet until">
          </span>
        </div>
      </details>
      <button id="pill-toggle" type="button" aria-pressed="false" hidden>Pill</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button id="replay-toggle" type="button" aria-pressed="false">Replay</button>
      <button id="copy-summary" type="button">Copy summary</button>
      <select id="export-select" aria-label="Export this run" hidden><option value="">Export…</option><option value="csv">CSV (agents)</option><option value="json">JSON (everything)</option></select>
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Theme: automatic" title="Theme: automatic">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.8 A6.2 6.2 0 0 1 10 16.2 Z" fill="currentColor"/></svg>
      </button>
      <button id="help-open" type="button" class="icon-btn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.9 8 a2.2 2.2 0 1 1 3.3 1.9 c-.8.5-1.2.9-1.2 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.2" r=".95" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <div id="totals" class="totals"></div>
</header>

<button id="recap" class="recap-bar" type="button" aria-expanded="false" title="Show the whole recap" hidden></button>
<div id="replay-bar" class="replay-bar" hidden></div>
<div id="attention" class="attention" hidden></div>
<div class="alerts">
  <div id="health" class="health" hidden></div>
  <div id="conflicts" class="health" hidden></div>
</div>

<section id="pulse" class="pulse" aria-label="Live pulse" hidden></section>

<div id="filter-bar" class="filter-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M13.4 13.4 L18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="filter-text" type="search" placeholder="Filter agents…" aria-label="Filter agents">
    <button type="button" id="filter-clear" class="filter-clear" aria-label="Clear filter" hidden>&times;</button>
  </div>
  <span id="filter-count" class="filter-count"></span>
  <div id="filter-status" class="filter-chips"></div>
</div>

<nav class="tabs" role="tablist">
  <button type="button" class="tab active" data-view="timeline" role="tab">Timeline</button>
  <button type="button" class="tab" data-view="graph" role="tab">Graph</button>
  <button type="button" class="tab" data-view="agents" role="tab">Agents</button>
  <button type="button" class="tab" data-view="insights" role="tab">Insights</button>
  <button type="button" class="tab" data-view="advice" role="tab">Advice <span id="advice-badge" class="badge" hidden></span></button>
  <button type="button" class="tab" data-view="spend" role="tab">Spend</button>
  <button type="button" class="tab" data-view="prompts" role="tab">Prompts</button>
  <button type="button" class="tab" data-view="activity" role="tab">Activity</button>
  <button type="button" class="tab" data-view="workfloor" role="tab">Work Floor</button>
  <button type="button" class="tab" data-view="fleet" role="tab">Fleet <span id="fleet-badge" class="badge" hidden></span></button>
  <button type="button" class="tab" data-view="history" role="tab">History</button>
</nav>

<main id="main" tabindex="-1">
  <div id="boot" class="boot" role="status"><span class="boot-dot"></span><span id="boot-text">Loading the run…</span></div>
  <div id="empty-state" class="empty-state" hidden>
    <h2>No subagents yet</h2>
    <p>Subagents appear here the moment this session launches them. There is nothing to set up.</p>
  </div>
  <section id="view-timeline" class="view">
    <svg id="timeline" role="img" aria-label="Agent timeline"></svg>
  </section>
  <section id="view-graph" class="view" hidden>
    <div class="graph-bar">
      <p id="graph-legend" class="graph-legend"></p>
      <div class="graph-tools" role="group" aria-label="Graph zoom">
        <button id="graph-zoom-in" type="button" class="icon-btn" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button id="graph-zoom-out" type="button" class="icon-btn" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
        <button id="graph-fit" type="button" title="Fit to the page (0)">Fit</button>
      </div>
    </div>
    <svg id="graph" role="group" tabindex="0" aria-label="Agent dependency graph. Drag to pan; plus, minus and zero zoom and fit."></svg>
    <div id="edge-evidence" class="evidence" hidden></div>
  </section>
  <section id="view-agents" class="view" hidden>
    <div id="agents" class="agents"></div>
  </section>
  <section id="view-insights" class="view" hidden>
    <div id="insights" class="insights"></div>
  </section>
  <section id="view-advice" class="view" hidden>
    <div id="advice" class="advice"></div>
  </section>
  <section id="view-spend" class="view" hidden>
    <div id="spend" class="spend"></div>
  </section>
  <section id="view-prompts" class="view" hidden>
    <div id="prompts" class="prompts"></div>
  </section>
  <section id="view-activity" class="view" hidden>
    <div class="calls-bar" role="search">
      <input id="calls-q" type="search" placeholder="Search every tool call: tool, file or command" aria-label="Search every tool call in this run" autocomplete="off" spellcheck="false">
      <button type="button" id="calls-failed" aria-pressed="false">Failed only</button>
      <span id="calls-count" class="calls-count" aria-live="polite"></span>
    </div>
    <div id="ticker" class="ticker"></div>
  </section>
  <section id="view-fleet" class="view" hidden>
    <div id="fleet" class="fleet"></div>
  </section>
  <section id="view-history" class="view" hidden>
    <div id="history" class="history"></div>
  </section>
  <section id="view-workfloor" class="view" hidden>
    <div class="floor-bar">
      <label for="floor-group">Group by</label>
      <select id="floor-group"><option value="type">Role</option><option value="status">Status</option></select>
    </div>
    <div id="workfloor" class="workfloor"></div>
  </section>
</main>

<div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="Search and commands" hidden>
  <div class="palette-box">
    <div class="palette-field">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 13.2 L17 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search agents, tool calls and files, or run a command">
      <kbd>Esc</kbd>
    </div>
    <div id="palette-list" class="palette-list" role="listbox" aria-label="Results"></div>
    <div class="palette-foot"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div id="help" class="palette help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" hidden>
  <div class="palette-box help-box">
    <h2>Keyboard shortcuts</h2>
    <dl id="help-list" class="help-list"></dl>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Agent detail"></aside>
<footer id="diagnostics" class="diagnostics"></footer>

<script src="app.js"></script>
<script src="tabs.js"></script>
<script src="advice.js"></script>
</body>
</html>
